# Review harness around the shipped wild generator: grids and review sheets,
# the placement-invariant checker, and the probe the browser lab is compared
# against. It is its own workspace so its dependencies and lints stay out of
# the shipped crates; scripts/check.sh gates it.
[package]
name = "ava-playground"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "grid"
path = "src/main.rs"

[dependencies]
avatar-svg = { path = "../crates/avatar-svg" }

[workspace]

# The invariant checker runs the generator over 300 seeds and the browser-lab
# comparison over 24; unoptimised floating-point code made them among the
# slowest stages of the gate. Optimisation does not change output (see the same
# setting in the root Cargo.toml).
[profile.dev]
opt-level = 1
