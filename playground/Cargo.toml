# Look-first exploration sandbox (design note 008): float math allowed,
# no determinism, never shipped, excluded from the workspace so the CI
# gates never see it. The chosen look gets frozen into the real crates;
# this crate gets deleted.
[package]
name = "ava-playground"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "grid"
path = "src/main.rs"

[dependencies]
avatar-svg = { path = "../crates/avatar-svg" }

[workspace]
