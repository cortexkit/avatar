<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AVA creature lab — wild pipeline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; display: flex; font-family: ui-monospace, Menlo, monospace; background: #1c1a20; color: #d8d2de; }
  #panel { width: 300px; padding: 14px; background: #232028; height: 100vh; overflow-y: auto; box-sizing: border-box; flex-shrink: 0; }
  #stage { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 18px; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #9a93a6; margin: 16px 0 6px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .row label { width: 86px; font-size: 11px; color: #b6afc2; }
  .row input[type=range] { flex: 1; accent-color: #a78bfa; }
  .row output { width: 38px; font-size: 11px; text-align: right; color: #cfc8da; }
  select, input[type=text] { background: #2e2a36; color: #ddd; border: 1px solid #443f52; border-radius: 6px; padding: 3px 6px; font: inherit; font-size: 12px; }
  button { background: #2e2a36; color: #ddd; border: 1px solid #443f52; border-radius: 7px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { background: #3a3546; }
  button.active { background: #a78bfa; color: #1c1a20; border-color: #a78bfa; }
  #moods { display: flex; flex-wrap: wrap; gap: 5px; }
  #view { background: #efe9e4; border-radius: 14px; }
  #sizes { display: flex; gap: 14px; margin-top: 14px; align-items: flex-end; }
  .mini { text-align: center; font-size: 10px; color: #8f8a96; }
  .mini > div { background: #efe9e4; border-radius: 6px; margin-bottom: 3px; }
  #metrics { margin-top: 14px; font-size: 11px; font-family: monospace; min-height: 15px; }
  #metrics .ok { color: #7bbf87; } #metrics .warn { color: #d6b25e; }
  #metrics .bad { color: #e2726e; } #metrics .dim, .dim { color: #7a7580; }
  #sweeprow { margin-top: 8px; display: flex; gap: 8px; align-items: center; font-size: 11px; }
  #pins { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .pin { width: 84px; cursor: pointer; text-align: center; font-size: 10px; color: #8f8a96; }
  .pin > div { background: #efe9e4; border-radius: 8px; }
  .hint { font-size: 10px; color: #756e82; line-height: 1.5; margin: 6px 0; }
</style>
</head>
<body>
<div id="panel">
  <h1>AVA creature lab — wild pipeline</h1>
  <div class="row">
    <input type="text" id="seed" value="4000" style="width:80px">
    <button id="decodeBtn">decode</button>
    <button id="gachaBtn">gacha 🎲</button>
  </div>
  <div class="hint">Seeds 4000+ match committed grid-10 cells. Knobs override the decoded genome; sliders marked ×1 are multipliers on decoded values.</div>

  <h2>Body</h2>
  <div class="row"><label>spokes</label><input type="range" id="spokes" min="5" max="16" step="1"><output></output></div>
  <div class="row"><label>domestication</label><input type="range" id="dom" min="0" max="1" step="0.01"><output></output></div>
  <div class="row"><label>radius ×</label><input type="range" id="radScale" min="0.5" max="1.5" step="0.01" value="1"><output></output></div>
  <div class="row"><label>tension ×</label><input type="range" id="tenScale" min="0.4" max="1.6" step="0.01" value="1"><output></output></div>
  <div class="row"><button id="rerollBody">reroll body</button></div>

  <h2>Extremities</h2>
  <div class="row"><label>pairs</label><input type="range" id="extCount" min="0" max="4" step="1"><output></output></div>
  <div class="row"><label>length ×</label><input type="range" id="extLen" min="0.4" max="1.8" step="0.01" value="1"><output></output></div>
  <div class="row"><label>width ×</label><input type="range" id="extWid" min="0.4" max="1.8" step="0.01" value="1"><output></output></div>
  <div class="row"><label>curl ×</label><input type="range" id="extCurl" min="-1.6" max="1.6" step="0.01" value="1"><output></output></div>
  <div class="row"><button id="rerollExt">reroll extremities</button></div>

  <h2>Topology</h2>
  <div class="row">
    <select id="topology">
      <option value="0">merged (SDF weld)</option>
      <option value="1">layered — tone fills</option>
      <option value="2">layered — accent fills</option>
    </select>
  </div>
  <div class="row"><label>weld radius ×</label><input type="range" id="weld" min="0.3" max="2.5" step="0.01" value="1"><output></output></div>

  <h2>Surface</h2>
  <div class="row"><label>voronoi</label><input type="checkbox" id="voronoi"></div>
  <div class="row"><button id="rerollSites">reroll pattern</button></div>

  <h2>Palette</h2>
  <div class="row">
    <select id="recipe">
      <option value="0">pastel analogous</option>
      <option value="2">toy saturated</option>
      <option value="4">muted earthy</option>
      <option value="3">dark gravitas</option>
    </select>
  </div>
  <div class="row"><label>hue</label><input type="range" id="hue" min="0" max="360" step="1"><output></output></div>

  <h2>Face</h2>
  <div class="row">
    <select id="eyes">
      <option value="0">dot + shine</option>
      <option value="1">lidded</option>
      <option value="2">happy arc</option>
      <option value="3">uneven (gremlin)</option>
      <option value="4">half-lid (deadpan)</option>
    </select>
  </div>
  <div class="row">
    <select id="mouth">
      <option value="0">arc</option>
      <option value="1">cat ω</option>
      <option value="2">open happy</option>
      <option value="3">snaggle</option>
      <option value="4">flat</option>
      <option value="5">fangs</option>
    </select>
  </div>

  <h2>Mood</h2>
  <div id="moods"></div>

  <h2>Compare</h2>
  <div class="row"><button id="pinBtn">pin current →</button><button id="clearPins">clear pins</button></div>
</div>

<div id="stage">
  <div id="view"></div>
  <div id="sizes">
    <div class="mini"><div id="s64"></div>64</div>
    <div class="mini"><div id="s44"></div>44</div>
    <div class="mini"><div id="s28"></div>28</div>
  </div>
  <div id="metrics"></div>
  <div id="sweeprow">
    <button id="sweep50">stress 50</button>
    <button id="sweep300">stress 300</button>
    <span class="dim">runs the placement invariants over random seeds</span>
  </div>
  <div id="pins"></div>
</div>

<script>
"use strict";
// Match Rust's f64::round exactly: half away from zero. Math.round breaks
// ties toward +infinity, which on |value| IS away from zero, so applying it to
// the magnitude and restoring the sign is exact. Not Math.floor(value + 0.5):
// that addition rounds first, so 0.49999999999999994 + 0.5 is exactly 1.0 and
// floors to 1 where Rust gives 0, and odd integers above 2^52 round up.
function roundHalfAway(value) {
  return Math.sign(value) * Math.round(Math.abs(value));
}
// Shared with avatar_svg::wild::math: same reduction, coefficients and order.
function wildSin(angle) {
  const tau = 2 * Math.PI;
  const x = angle - roundHalfAway(angle / tau) * tau;
  const x2 = x * x;
  let p = 1.0 / 15_511_210_043_330_985_984_000_000.0;
  p = -1.0 / 25_852_016_738_884_976_640_000.0 + x2 * p;
  p = 1.0 / 51_090_942_171_709_440_000.0 + x2 * p;
  p = -1.0 / 121_645_100_408_832_000.0 + x2 * p;
  p = 1.0 / 355_687_428_096_000.0 + x2 * p;
  p = -1.0 / 1_307_674_368_000.0 + x2 * p;
  p = 1.0 / 6_227_020_800.0 + x2 * p;
  p = -1.0 / 39_916_800.0 + x2 * p;
  p = 1.0 / 362_880.0 + x2 * p;
  p = -1.0 / 5_040.0 + x2 * p;
  p = 1.0 / 120.0 + x2 * p;
  p = -1.0 / 6.0 + x2 * p;
  return x * (1.0 + x2 * p);
}
function wildCos(angle) { return wildSin(angle + Math.PI / 2); }
// Latest placement invariants, recorded by creatureSVG at full size.
let lastMetrics = null;
window.addEventListener("error", e => {
  const v = document.getElementById("view");
  if (v) v.innerHTML = `<pre style='color:#c33;font-size:11px;padding:12px;white-space:pre-wrap'>${e.message}\n${e.filename}:${e.lineno}</pre>`;
});
// ============ bit source (splitmix64 via BigInt — matches Rust) ============
function seedFromText(text) {
  // Keep decimal seeds out of Number: values above 2^53 would lose genome bits.
  const decimal = /^\s*[+-]?\d+/.exec(text);
  return decimal ? BigInt(decimal[0].trim()) : 0n;
}
function bits(seed) {
  let s = BigInt(seed) & 0xFFFFFFFFFFFFFFFFn;
  const M = 0xFFFFFFFFFFFFFFFFn;
  return {
    byte() {
      s = (s + 0x9e3779b97f4a7c15n) & M;
      let z = s;
      z = ((z ^ (z >> 30n)) * 0xbf58476d1ce4e5b9n) & M;
      z = ((z ^ (z >> 27n)) * 0x94d049bb133111ebn) & M;
      return Number(((z ^ (z >> 31n)) >> 24n) & 0xFFn);
    },
    lin(lo, hi) { return lo + (hi - lo) * (this.byte() / 255); },
  };
}

// One region decoder serves both the page and the geometry probe.
function decodeGenome(seed) {
  const b = bits(seed);
  const bytes = Array.from({ length: 16384 }, () => b.byte());
  const lin = (offset, lo, hi) => lo + (hi - lo) * (bytes[offset] / 255);
  // 5..=16 spokes: silhouette is the best-funded channel now (budget moved
  // over from the surface region). Mirrors Rust wild::decode.
  const spokeCount = 5 + (bytes[0] % 12);
  const spokes = [];
  for (let i = 0; i < spokeCount; i++) {
    const slot = 2 + 3 * i;
    const base = (i / spokeCount) * Math.PI * 2;
    const jitter = lin(slot, -0.45, 0.45) * Math.PI * 2 / spokeCount;
    spokes.push({ theta: base + jitter, r: lin(slot + 1, 0.12, 1.35), tension: lin(slot + 2, 0.4, 2.6) });
  }
  const extCount = bytes[64] % 5;
  const exts = [];
  for (let i = 0; i < extCount; i++) {
    const slot = 64 + 4 + 10 * i;
    exts.push({
      theta: lin(slot, Math.PI * 0.95, Math.PI * 2 * 1.02),
      len: lin(slot + 1, 0.35, 1.15),
      width: lin(slot + 2, 0.10, 0.30),
      curl: lin(slot + 3, -1.3, 1.3),
      taper: lin(slot + 4, 0.15, 0.85),
    });
  }
  // 8..=13 pairs, sparse shading (2-in-4 skip): hide spots, not tiling.
  // Sites GENERATED from a 16-bit seed rather than stored (24 genome bits
  // instead of 200-320) — Lloyd relaxation evens them anyway, so their
  // exact stored positions never earned their cost. Mirrors Rust.
  const pairCount = 8 + (bytes[241] % 6);
  // Same domain constant as Rust surface::decode_sites — a different XOR
  // here would silently give the lab and the sheets different mottle for
  // the same seed, which is exactly the cross-renderer drift the corpus
  // exists to prevent.
  const siteSeed = (BigInt((bytes[242] << 8) | bytes[243])) ^ 0x5175726661636501n;
  const r = bits(siteSeed);
  const sites = [];
  for (let i = 0; i < pairCount; i++) {
    const x = r.lin(0.04, 1.05), y = r.lin(-1.05, 1.05);
    const s3 = r.byte() % 4, shade = s3 === 0 ? 0 : s3 === 1 ? 1 : 2;
    sites.push({ x, y, shade }, { x: -x, y, shade });
  }
  const rsel = bytes[160] % 8;
  const recipe = rsel <= 2 ? 0 : rsel <= 4 ? 2 : rsel <= 6 ? 4 : 3;
  const hue = (bytes[161] / 255 + bytes[162] / 65535) * 360;
  const eyes = bytes[176] % 5;
  const mouth = bytes[179] % 6;
  const extFills = exts.map((_, i) => bytes[64 + 4 + 10 * i + 5] % 3);
  const topology = bytes[65] % 3;
  const voronoi = (bytes[240] % 5) < 2;
  const bellyVariant = bytes[163] % 4;
  // Face-parameter block (mirrors Rust FaceStyle): per-creature proportion
  // and resting posture. Without it the whole population shared 30 faces,
  // since two creatures with the same eye+mouth archetype rendered
  // identically. Signed eye wonk shrinks one eye without enlarging the other.
  const eyeAspect = lin(177, 0.80, 1.28);
  const eyeWonk = lin(178, -0.20, 0.20); // signed: negative shrinks the left eye
  const mouthW = lin(180, 0.75, 1.30);
  const mouthD = lin(181, 0.70, 1.35);
  const browRoll = bytes[182] % 8;
  const brow = browRoll <= 1 ? 1 : browRoll === 2 ? 2 : browRoll === 3 ? 3 : 0;
  return { spokes, exts, extFills, sites, recipe, hue, eyes, mouth, topology, voronoi, bellyVariant,
           eyeAspect, eyeWonk, mouthW, mouthD, brow, dom: 0.32 };
}

// ============ wild body (fold-mirror + Catmull-Rom + domestication) ============
function preparedPoints(spokes, dom) {
  const TAU = Math.PI * 2;
  let half = spokes.map(s => {
    let t = ((s.theta % TAU) + TAU) % TAU;
    if (wildCos(t) < 0) t = Math.PI - t;
    return { theta: t, r: s.r, tension: s.tension };
  });
  const mirrored = half.map(s => ({ theta: Math.PI - s.theta, r: s.r, tension: s.tension }));
  let all = half.concat(mirrored).map(s => ({ ...s, theta: ((s.theta % TAU) + TAU) % TAU }));
  all.sort((a, b) => a.theta - b.theta);
  const dedup = [];
  for (const s of all) {
    if (!dedup.length || Math.abs(s.theta - dedup[dedup.length - 1].theta) >= 1e-3) dedup.push(s);
  }
  const k = 0.55 * dom;
  let radii = dedup.map(s => s.r);
  for (let pass = 0; pass < 2; pass++) {
    const prev = radii.slice();
    const n = prev.length;
    for (let i = 0; i < n; i++) {
      radii[i] = prev[i] * (1 - k) + (prev[(i + n - 1) % n] + prev[(i + 1) % n]) * 0.5 * k;
    }
  }
  const meanR = radii.reduce((a, b) => a + b, 0) / radii.length;
  const floor = meanR * 0.55 * dom;
  radii = radii.map(r => Math.max(r, floor));
  return dedup.map((s, i) => ({
    x: wildCos(s.theta) * radii[i],
    y: wildSin(s.theta) * radii[i],
    t: s.tension + (1 - s.tension) * dom,
  }));
}

function sampleOutline(spokes, dom) {
  const pts = preparedPoints(spokes, dom);
  const n = pts.length;
  const out = [];
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i + n - 1) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1 = [p1.x + (p2.x - p0.x) / 6 * p1.t, p1.y + (p2.y - p0.y) / 6 * p1.t];
    const c2 = [p2.x - (p3.x - p1.x) / 6 * p2.t, p2.y - (p3.y - p1.y) / 6 * p2.t];
    for (let s = 0; s < 18; s++) {
      const u = s / 18, v = 1 - u;
      out.push([
        v*v*v*p1.x + 3*v*v*u*c1[0] + 3*v*u*u*c2[0] + u*u*u*p2.x,
        v*v*v*p1.y + 3*v*v*u*c1[1] + 3*v*u*u*c2[1] + u*u*u*p2.y,
      ]);
    }
  }
  // ground flatten
  let minY = 1/0, maxY = -1/0;
  for (const p of out) { minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }
  const ground = maxY - (maxY - minY) * 0.14;
  const squash = 0.30 + 0.35 * dom;
  for (const p of out) if (p[1] > ground) p[1] = ground + (p[1] - ground) * squash;
  return out;
}

// ============ extremities ============
function extremityOutline(e, ringR, meanR, mirror) {
  const theta = mirror ? Math.PI - e.theta : e.theta;
  const curl = mirror ? -e.curl : e.curl;
  const root = [wildCos(theta) * ringR * 0.85, wildSin(theta) * ringR * 0.85];
  const len = e.len * meanR, steps = 14;
  const spine = [];
  let dir = theta, p = root.slice();
  for (let i = 0; i <= steps; i++) {
    spine.push(p.slice());
    if (i < steps) {
      dir += curl / steps;
      p = [p[0] + wildCos(dir) * len / steps, p[1] + wildSin(dir) * len / steps];
    }
  }
  // Cap half-width by the spine's radius of curvature (ρ = len/|curl|):
  // wider offsets self-cross at strong curls and render as shards.
  const curvCap = Math.abs(e.curl) > 1e-6 ? 0.8 * len / Math.abs(e.curl) : 1/0;
  const baseW = Math.min(e.width * meanR, curvCap);
  const left = [], right = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const w = baseW * (1 - (1 - e.taper) * t);
    const [x, y] = spine[i];
    let dx, dy;
    if (i === 0) { dx = spine[1][0] - x; dy = spine[1][1] - y; }
    else { dx = x - spine[i-1][0]; dy = y - spine[i-1][1]; }
    const l = Math.hypot(dx, dy) || 1e-9;
    left.push([x - dy/l*w, y + dx/l*w]);
    right.push([x + dy/l*w, y - dx/l*w]);
  }
  const tip = spine[steps];
  const pr = spine[steps-1];
  const l = Math.hypot(tip[0]-pr[0], tip[1]-pr[1]) || 1e-9;
  const tipW = baseW * e.taper;
  return left.concat([[tip[0] + (tip[0]-pr[0])/l*tipW, tip[1] + (tip[1]-pr[1])/l*tipW]], right.reverse());
}

// ============ SDF merge (smooth-min + marching squares) ============
// Inside = NONZERO WINDING (SVG's fill/clip rule), not crossing parity:
// self-crossing outlines make the two disagree and faces got placed in
// clipped-away notches (mirrors Rust merge.rs).
function polySDF(pts, x, y) {
  const n = pts.length;
  let d2 = 1/0, wn = 0;
  for (let i = 0; i < n; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % n];
    const ex = x2 - x1, ey = y2 - y1, px = x - x1, py = y - y1;
    const t = Math.min(1, Math.max(0, (px*ex + py*ey) / (ex*ex + ey*ey || 1e-12)));
    const qx = px - ex*t, qy = py - ey*t;
    d2 = Math.min(d2, qx*qx + qy*qy);
    const cross = ex*py - ey*px;
    if (y1 <= y && y2 > y && cross > 0) wn++;
    else if (y2 <= y && y1 > y && cross < 0) wn--;
  }
  return (wn !== 0 ? -1 : 1) * Math.sqrt(d2);
}
function smin(a, b, k) {
  if (k <= 0) return Math.min(a, b);
  const h = Math.min(1, Math.max(0, 0.5 + 0.5 * (b - a) / k));
  return b * (1 - h) + a * h - k * h * (1 - h);
}
function mergedOutline(shapes, bbox, weld, res) {
  const [minX, minY, maxX, maxY] = bbox;
  const pad = weld * 2 + 6;
  const x0 = minX - pad, y0 = minY - pad, x1 = maxX + pad, y1 = maxY + pad;
  const dx = (x1 - x0) / res, dy = (y1 - y0) / res;
  const field = new Float64Array((res + 1) * (res + 1));
  for (let j = 0; j <= res; j++) for (let i = 0; i <= res; i++) {
    // Finite sentinel, NOT Infinity: smin computes a*h with h=0 for a huge
    // first argument, and Infinity*0 is NaN — which silently poisons the
    // whole field (Rust uses f64::MAX and never hits this).
    let v = 1e30;
    const x = x0 + i * dx, y = y0 + j * dy;
    for (const sh of shapes) v = smin(v, polySDF(sh, x, y), weld);
    field[j * (res + 1) + i] = v;
  }
  const at = (i, j) => field[j * (res + 1) + i];
  const lerp = (a, b) => a / (a - b);
  const segs = [];
  for (let j = 0; j < res; j++) for (let i = 0; i < res; i++) {
    const v00 = at(i, j), v10 = at(i+1, j), v01 = at(i, j+1), v11 = at(i+1, j+1);
    const gx = x0 + i * dx, gy = y0 + j * dy;
    const pts = [];
    if ((v00 < 0) !== (v10 < 0)) pts.push([gx + dx * lerp(v00, v10), gy]);
    if ((v10 < 0) !== (v11 < 0)) pts.push([gx + dx, gy + dy * lerp(v10, v11)]);
    if ((v01 < 0) !== (v11 < 0)) pts.push([gx + dx * lerp(v01, v11), gy + dy]);
    if ((v00 < 0) !== (v01 < 0)) pts.push([gx, gy + dy * lerp(v00, v01)]);
    if (pts.length === 2) segs.push([pts[0], pts[1]]);
    else if (pts.length === 4) { segs.push([pts[0], pts[1]]); segs.push([pts[2], pts[3]]); }
  }
  const eps = Math.min(dx, dy) * 0.5;
  const used = new Array(segs.length).fill(false);
  let bestLoop = [];
  for (let start = 0; start < segs.length; start++) {
    if (used[start]) continue;
    const chain = [segs[start][0], segs[start][1]];
    used[start] = true;
    for (;;) {
      const tail = chain[chain.length - 1];
      let ext = false;
      // NEAREST candidate wins, lowest index breaks ties — not "first
      // within eps". Both are deterministic, but at a saddle where two
      // segments qualify, first-by-index chains into an arbitrary branch
      // while nearest follows the contour. Rust pinned this during the
      // fixed-point spike; the lab kept the old rule and produced visibly
      // different merged silhouettes until scripts/drift-check.sh caught
      // it. Squared distances, so the ordering needs no sqrt.
      let bestIdx = -1, bestD = Infinity, bestHead = false;
      for (let idx = 0; idx < segs.length; idx++) {
        if (used[idx]) continue;
        const s = segs[idx];
        const d0 = (s[0][0]-tail[0])**2 + (s[0][1]-tail[1])**2;
        const d1 = (s[1][0]-tail[0])**2 + (s[1][1]-tail[1])**2;
        const d = Math.min(d0, d1);
        if (d < eps*eps && d < bestD) { bestD = d; bestIdx = idx; bestHead = d0 <= d1; }
      }
      if (bestIdx >= 0) {
        chain.push(bestHead ? segs[bestIdx][1] : segs[bestIdx][0]);
        used[bestIdx] = true;
        ext = true;

  return `<g transform='rotate(${angle} ${x} ${y})'><rect x='${x-cover}' y='${bottom-2.6*r}' width='${cover*2}' height='${2.6*r}' fill='${bodyFill}'/><line x1='${x-cover*0.82}' y1='${bottom}' x2='${x+cover*0.82}' y2='${bottom}' stroke='${outline}' stroke-width='2.2' stroke-linecap='round'/></g>`;
}
function squintOverlay(x, y, r, sq, bodyFill, outline) {
  if (sq <= 0.01) return "";
  const top = y + r - 2*r*sq;
  return `<path d='M${x-r*1.2} ${y+r*1.3} Q${x} ${top-r*0.4} ${x+r*1.2} ${y+r*1.3} L${x+r*1.2} ${y+r*1.5} L${x-r*1.2} ${y+r*1.5} Z' fill='${bodyFill}'/><path d='M${x-r*1.05} ${y+r*1.05} Q${x} ${top} ${x+r*1.05} ${y+r*1.05}' stroke='${outline}' stroke-width='2.2' fill='none' stroke-linecap='round'/>`;
}
function drawBrow(kind, x, y, r, side, ink) {
  if (!kind) return "";
  const by = y - r*1.7, w = r*0.95;
  const cfg = { 1: [0.1, 0, 0], 2: [-0.15, -0.05, -0.5], 3: [0.55, -0.15, 0.1], 4: [-0.55, 0.15, 0] }[kind];
  const [innerDy, outerDy, lift] = [cfg[0]*r, cfg[1]*r, cfg[2]*r];
  return `<line x1='${x - side*w}' y1='${by+innerDy+lift}' x2='${x + side*w}' y2='${by+outerDy+lift}' stroke='${ink}' stroke-width='3.2' stroke-linecap='round'/>`;
}
function drawAdjunct(kind, cx, topY, sc, ink) {
  if (kind === 1) return `<text x='${cx+68*sc}' y='${topY+16*sc}' font-family='monospace' font-weight='bold' font-size='${22*sc}' fill='${ink}' opacity='0.75'>z</text><text x='${cx+86*sc}' y='${topY-2*sc}' font-family='monospace' font-weight='bold' font-size='${28*sc}' fill='${ink}' opacity='0.55'>Z</text>`;
  if (kind === 2) return `<path d='M${cx+52*sc} ${topY+18*sc} Q${cx+60*sc} ${topY+34*sc} ${cx+52*sc} ${topY+40*sc} Q${cx+44*sc} ${topY+34*sc} ${cx+52*sc} ${topY+18*sc} Z' fill='#7fb8e8' opacity='0.85'/>`;
  return "";
}

// ============ full render ============
let uid = 0;
function creatureSVG(k, moodName, size) {
  const dom = k.dom;
  const spokes = k.spokes.map(s => ({ theta: s.theta, r: s.r * k.radScale, tension: s.tension * k.tenScale }));
  const raw = sampleOutline(spokes, dom);
  const meanR = spokes.reduce((a,s) => a + s.r, 0) / spokes.length;
  // Root radius from the ACTUAL post-domestication outline (nearest ray
  // crossing), not the nearest raw spoke: smoothing moves the curve inward
  // and roots that trusted the raw radius floated free of the body.
  // Mirrors Rust wild::radius_along.
  const ringRAt = th => {
    const dx = wildCos(th), dy = wildSin(th);
    let best = null;
    for (let i = 0; i < raw.length; i++) {
      const [x1,y1] = raw[i], [x2,y2] = raw[(i+1) % raw.length];
      const ex = x2-x1, ey = y2-y1;
      const den = dx*ey - dy*ex;
      if (Math.abs(den) < 1e-12) continue;
      const sPar = (dx*y1 - dy*x1) / den;
      if (sPar < 0 || sPar > 1) continue;
      const px = x1 + ex*sPar, py = y1 + ey*sPar;
      const t = Math.abs(dx) > Math.abs(dy) ? px/dx : py/dy;
      if (t > 1e-9 && (best === null || t < best)) best = t;
    }
    return best === null ? meanR : best;
  };
  const exts = k.exts.slice(0, k.extCount).map(e => ({
    theta: e.theta, len: e.len * k.extLen, width: e.width * k.extWid,
    curl: e.curl * k.extCurl, taper: e.taper,
  }));
  const extOutlines = [];
  exts.forEach((e, i) => {
    const right = extremityOutline(e, ringRAt(e.theta), meanR, false);
    extOutlines.push([i, right], [i, right.map(p => [-p[0], p[1]])]);
  });
  let bx0=1/0, by0=1/0, bx1=-1/0, by1=-1/0;
  for (const p of raw) { bx0=Math.min(bx0,p[0]); by0=Math.min(by0,p[1]); bx1=Math.max(bx1,p[0]); by1=Math.max(by1,p[1]); }
  for (const [,pts] of extOutlines) for (const p of pts) { bx0=Math.min(bx0,p[0]); by0=Math.min(by0,p[1]); bx1=Math.max(bx1,p[0]); by1=Math.max(by1,p[1]); }
  const view = size || 420;
  // EXACTLY canonical's fit: Rust scales into 172x198 of a 240-unit cell,
  // i.e. 0.71667 and 0.825 of the frame. The lab had 0.72 and 0.8, so every
  // creature here was a slightly different shape from the one the corpus
  // will pin — a review instrument showing a near-miss of the real thing.
  const scale = Math.min((view*(172/240))/(bx1-bx0 || 1), (view*(198/240))/(by1-by0 || 1));
  const cx = view/2, cy = view/2;
  const mx = (bx0+bx1)/2, my2 = (by0+by1)/2;
  const T = p => [cx + (p[0]-mx)*scale, cy + (p[1]-my2)*scale];

  const merged = +k.topology === 0 && extOutlines.length > 0;
  let outline;
  if (merged) {
    const shapes = [raw.filter((_,i) => i % 3 === 0)].concat(extOutlines.map(([,pts]) => pts));
    // Resolution 130 matches Rust. A coarser grid is a different contour,
    // not a faster one: marching squares changes shape with resolution.
    outline = mergedOutline(shapes, [bx0,by0,bx1,by1], meanR * 0.16 * k.weld, 130).map(T);
  } else {
    outline = raw.map(T);
  }
  const [minX, minY, maxX, maxY] = bboxOf(outline);
  const h = maxY - minY;
  const colors = resolveColors(k.recipe, k.hue);
  const spec = moodSpec(moodName);

  let s = `<svg xmlns='http://www.w3.org/2000/svg' width='${view}' height='${view}' viewBox='0 0 ${view} ${view}'>`;
  s += `<ellipse cx='${cx}' cy='${maxY+4}' rx='${(maxX-minX)*0.42}' ry='6' fill='rgba(40,30,50,0.14)'/>`;
  if (!merged) {
    for (const [ei, pts] of extOutlines) {
      const fill = +k.topology === 2 ? colors.part : (k.extFills[ei] === 0 ? tone(k.recipe, k.hue, 1) : k.extFills[ei] === 1 ? tone(k.recipe, k.hue, -1) : colors.body);
      s += `<path d='${pts.map((p,i) => (i?'L':'M') + T(p).map(v=>v.toFixed(1)).join(' ')).join(' ')} Z' fill='${fill}' stroke='${colors.outline}' stroke-width='1.5' stroke-linejoin='round'/>`;
    }
  }
  const d = outline.map((p,i) => (i?'L':'M') + p.map(v=>v.toFixed(1)).join(' ')).join(' ') + ' Z';
  const clip = `lab${uid++}`;
  s += `<defs><clipPath id='${clip}'><path d='${d}'/></clipPath></defs><path d='${d}' fill='${colors.body}' stroke='${colors.outline}' stroke-width='1.5'/>`;
  s += `<g clip-path='url(#${clip})'>`;

  const p = placeFace(outline, k.mouthW ?? 1, k.mouthD ?? 1);
  // Record the placement invariants for the readout: the same quantities
  // the Rust `--check` sweep asserts, so what the lab shows and what the
  // gate enforces can never drift into two different truths.
  if (size >= 200) {
    if (!p) lastMetrics = { placed: false };
    else {
      const sparse = outline.filter((_, i) => i % 2 === 0);
      const eyeClear = Math.min(
        -polySDF(sparse, p.fx - p.ipd, p.eyeY) - p.r,
        -polySDF(sparse, p.fx + p.ipd, p.eyeY) - p.r);
      const sep = 2*p.ipd - 2*p.r*1.45;
      // Measured at the creature's own mouth scale, same as the gate.
      const my = p.eyeY + p.r*2.71;
      const mhalf = p.r*0.8*(k.mouthW ?? 1), mdeep = p.r*0.62*(k.mouthD ?? 1);
      const mouthClear = Math.min(
        -polySDF(sparse, p.fx - mhalf, my),
        -polySDF(sparse, p.fx + mhalf, my),
        -polySDF(sparse, p.fx, my + mdeep));
      // On the fallback path no mouth is drawn, so its clearance is not a
      // property of the render — report it as satisfied rather than as a
      // breach of geometry that does not exist.
      lastMetrics = {
        placed: true,
        eyeClear,
        sep,
        mouthClear: p.mouthFits === false ? Infinity : mouthClear,
        r: p.r,
        pts: outline.length,
        // Probe fields: the canonical geometry line, so the two renderers
        // can be diffed rather than assumed to agree.
        probe: {
          spokes: k.spokes.length, exts: extOutlines.length / 2,
          topo: +k.topology, vor: k.voronoi ? 1 : 0,
          pts: outline.length, bbox: [minX, minY, maxX, maxY],
          fx: p.fx, eyeY: p.eyeY, ipd: p.ipd, r: p.r,
          mouthFits: p.mouthFits === false ? 0 : 1,
          // Probed because it is DERIVED at draw time rather than produced
          // by the search: every placement field agreed while this drew
          // 0.8r high, because nothing compared this step's output.
          mouthY: mouthYFor(p.eyeY, p.r),
          belly: 0, // filled in below, once the patch is built
        },
      };
    }
  }

  if (k.voronoi) {
    const cellBbox = [minX, minY, maxX, maxY];
    const scaled = k.sites.map(site => ({ x: cx + site.x*(maxX-minX)/2, y: (minY+maxY)/2 + site.y*(maxY-minY)/2, shade: site.shade }));
    for (let it = 0; it < 2; it++) {
      scaled.forEach((site, i) => {
        const poly = clipCell(scaled, i, cellBbox);
        if (poly.length >= 3) { const [ccx, ccy] = centroid(poly); site.x = ccx; site.y = ccy; }
      });
    }
    const [light, dark] = mottle(k.recipe, k.hue);
    // Mottle belongs to the hide, not the face: fade cells out over the
    // face-and-belly capsule (radial mask), mirroring the Rust renderer.
    let masked = false;
    if (p) {
      const capTop = p.eyeY - p.r * 2.2;
      const capBot = minY + h * 0.62 + h * 0.29;
      const capCy = (capTop + capBot) / 2, capRy = (capBot - capTop) / 2;
      const capRx = Math.max(p.ipd + p.r * 2.6, p.halfW * 0.66);
      const mid = `vm${uid++}`;
      s += `<defs><radialGradient id='fg${mid}'><stop offset='0.62' stop-color='black'/><stop offset='1' stop-color='white'/></radialGradient><mask id='${mid}'><rect x='${minX-20}' y='${minY-20}' width='${maxX-minX+40}' height='${maxY-minY+40}' fill='white'/><ellipse cx='${p.fx}' cy='${capCy}' rx='${capRx}' ry='${capRy}' fill='url(#fg${mid})'/></mask></defs><g mask='url(#${mid})'>`;
      masked = true;
    }
    scaled.forEach((site, i) => {
      if (site.shade === 2) return;
      const poly = clipCell(scaled, i, cellBbox);
      if (poly.length < 3) return;
      s += `<path d='${pebblePath(poly, 0.8)}' fill='${site.shade === 0 ? dark : light}'/>`;
    });
    if (masked) s += `</g>`;
  }
  if (p) {
    // Belly follows the body's own width profile down the band, staying on
    // one mass, with a sqrt ramp closing the crown to a point. Mirrors Rust
    // belly_patch — an ellipse read as a ball on lumpy bodies and a smear
    // across split legs.
    const bellyPts = bellyPatch(outline, bellyTopFor(p.eyeY, p.r), 0.72);
    if (lastMetrics && lastMetrics.probe) lastMetrics.probe.belly = bellyPts.length;
    if (bellyPts.length >= 3) {
      s += `<path d='${bellyPts.map((q,i) => (i?'L':'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ')} Z' fill='${bellyFill(k.recipe, k.hue, k.bellyVariant ?? 0)}'/>`;
    }
    // The search-chosen ipd IS the spacing (it may have pulled eyes inward
    // off thin side masses) — never re-derive from halfW.
    const f = eyeFrame(p);
    s += `<ellipse cx='${f.lx - p.r*1.28}' cy='${f.y + p.r*1.3}' rx='${p.r*0.82}' ry='${p.r*0.5}' fill='${colors.blush}' opacity='0.8'/>`;
    s += `<ellipse cx='${f.rx + p.r*1.28}' cy='${f.y + p.r*1.3}' rx='${p.r*0.82}' ry='${p.r*0.5}' fill='${colors.blush}' opacity='0.8'/>`;
    let eyesSvg = drawEyes(k.eyes, f, colors.outline, colors.ink, colors.pupil, colors.sclera, k.eyeWonk ?? 0);
    // Eye aspect as min-scaling: both factors <= 1, so an eye can only
    // shrink inside the placed radius the invariants were proved for.
    const asp = k.eyeAspect ?? 1;
    const ax = asp >= 1 ? 1/asp : 1, ay = asp >= 1 ? 1 : asp;
    const esx = ax * spec.es, esy = ay * spec.es;
    if (Math.abs(esx - 1) > 0.005 || Math.abs(esy - 1) > 0.005)
      eyesSvg = `<g transform='translate(${p.fx} ${f.y}) scale(${esx.toFixed(3)} ${esy.toFixed(3)}) translate(${-p.fx} ${-f.y})'>${eyesSvg}</g>`;
    s += eyesSvg;
    // Archetype-aware mood expression (mirrors Rust): lids/squints are
    // disc-eye concepts — suppressed on closed-arc eyes, only sleepy-scale
    // lids on half-lid, per-disc radii on uneven.
    const doSquint = k.eyes != 2 && k.eyes != 4;
    const doLid = k.eyes == 2 ? false : k.eyes == 4 ? spec.lid > 0.45 : true;
    for (const [x, side] of [[f.lx,-1],[f.rx,1]]) {
      // Overlays land on the radius the archetype actually drew.
      const er = k.eyes == 3 ? (side < 0 ? f.r*1.25 : f.r*0.62)
                             : f.r * wonkFactor(k.eyes, k.eyeWonk ?? 0, side > 0);
      const ey = k.eyes == 3 && side > 0 ? f.y + f.r*0.15 : f.y;
      if (doSquint) s += squintOverlay(x, ey, er, spec.sq, colors.body, colors.outline);
      if (doLid) s += lidOverlay(x, ey, er, spec.lid, spec.ang*side, colors.body, colors.outline);
      // Mood brows win; otherwise the creature's RESTING brow shows.
      const brows = spec.brows === 0 ? (k.brow ?? 0) : spec.brows;
      s += drawBrow(brows, x, f.y, f.r, side, colors.ink);
    }
    const mouthKind = spec.mouth === 0 ? k.mouth : spec.mouth === 1 ? 2 : spec.mouth === 2 ? 6 : spec.mouth === 3 ? 4 : 7;
    const my = mouthYFor(f.y, p.r);
    let mouthSvg = p.mouthFits === false
      ? ""
      : drawMouth(mouthKind, p.fx, my, p.r, colors.outline, colors.ink);
    // Mouth proportion; the placement search already tested fit at exactly
    // these factors, so a wide mouth moved the face rather than overflowing.
    const mw = k.mouthW ?? 1, md = k.mouthD ?? 1;
    if (Math.abs(mw - 1) > 0.02 || Math.abs(md - 1) > 0.02)
      mouthSvg = `<g transform='translate(${p.fx} ${my}) scale(${mw.toFixed(3)} ${md.toFixed(3)}) translate(${-p.fx} ${-my})'>${mouthSvg}</g>`;
    s += mouthSvg;
    s += `</g>`;
    s += drawAdjunct(spec.adj, cx, minY, h/200, colors.ink);
  } else {
    s += `</g>`;
  }
  return s + "</svg>";
}

// ============ UI wiring ============
let state = null;
let mood = "neutral";
const pins = [];
const $ = id => document.getElementById(id);

function knobIds() { return ["spokes","dom","radScale","tenScale","extCount","extLen","extWid","extCurl","weld","hue"]; }
function syncOutputs() {
  for (const id of knobIds()) {
    const el = $(id);
    if (el.nextElementSibling?.tagName === "OUTPUT") el.nextElementSibling.value = el.value;
  }
}
/// Pure-genome params: a decode with every knob at identity, which is what
/// the Rust `--check` sweep measures. The renderer consumes knob-merged
/// params, so a raw decode would render as NaN geometry — the sweep must
/// speak the renderer's input shape or it measures nothing.
function paramsFromSeed(seed) {
  const d = decodeGenome(seed);
  return {
    ...d,
    dom: d.dom,
    radScale: 1, tenScale: 1,
    extCount: d.exts.length,
    extLen: 1, extWid: 1, extCurl: 1,
    weld: 1,
  };
}
function currentParams() {
  return {
    ...state,
    dom: +$("dom").value,
    radScale: +$("radScale").value,
    tenScale: +$("tenScale").value,
    extCount: +$("extCount").value,
    extLen: +$("extLen").value,
    extWid: +$("extWid").value,
    extCurl: +$("extCurl").value,
    weld: +$("weld").value,
    topology: +$("topology").value,
    voronoi: $("voronoi").checked,
    recipe: +$("recipe").value,
    hue: +$("hue").value,
    eyes: +$("eyes").value,
    mouth: +$("mouth").value,
  };
}
function render() {
  syncOutputs();
  const k = currentParams();
  $("view").innerHTML = creatureSVG(k, mood, 420);
  for (const [id, size] of [["s64",64],["s44",44],["s28",28]]) {
    $(id).innerHTML = creatureSVG(k, mood, size);
    $(id).firstChild.style.borderRadius = "6px";
  }
  showMetrics();
}
function showMetrics() {
  const el = $("metrics");
  const m = lastMetrics;
  if (!m) { el.textContent = ""; return; }
  if (!m.placed) { el.innerHTML = "<b class='bad'>NO FACE PLACEMENT</b>"; return; }
  // Clearances get a warn band (tight is worth noticing). Eye gap does NOT:
  // the radius is capped BY the spacing, so gap 0.00 is the designed
  // equilibrium and the common case — flagging it amber would train the eye
  // to ignore the colour.
  const cell = (label, v, warnBand) => {
    const cls = v < 0 ? "bad" : warnBand && v < 1.5 ? "warn" : "ok";
    return `<span class='${cls}'>${label} ${v.toFixed(2)}</span>`;
  };
  el.innerHTML = [
    cell("eye clear", m.eyeClear, true),
    cell("eye gap", m.sep, false),
    cell("mouth clear", m.mouthClear, true),
    `<span class='dim'>r ${m.r.toFixed(1)} · ${m.pts} pts</span>`,
  ].join(" · ");
}
/// Self-serve stress sweep: runs the same invariants over N random seeds
/// in the browser, so a suspicion can be turned into a population number
/// without leaving the lab.
function stressSweep(n) {
  const el = $("metrics");
  const bad = [];
  let tightest = Infinity, tightestSeed = 0;
  const base = Math.floor(Math.random() * 900000);
  for (let i = 0; i < n; i++) {
    const seed = base + i;
    creatureSVG(paramsFromSeed(seed), "neutral", 420);
    const m = lastMetrics;
    if (!m.placed) { bad.push(`${seed}: no face`); continue; }
    const worst = Math.min(m.eyeClear, m.sep, m.mouthClear);
    // Same tolerance the Rust checker uses: the eye gap is exactly zero
    // whenever the spacing cap binds, so float epsilon must not read as a
    // violation. Two instruments, one rule.
    if (worst < -1e-9) bad.push(`${seed}: ${worst.toFixed(2)}`);
    if (worst < tightest) { tightest = worst; tightestSeed = seed; }
  }
  el.innerHTML = bad.length
    ? `<b class='bad'>${bad.length}/${n} violations</b> · ${bad.slice(0,6).join(", ")}`
    : `<b class='ok'>${n}/${n} clean</b> <span class='dim'>· tightest ${tightest.toFixed(2)} at seed ${tightestSeed} (type it in to inspect)</span>`;
}
function loadSeed() {
  const seed = seedFromText($("seed").value);
  state = decodeGenome(seed);
  $("spokes").value = state.spokes.length;
  $("dom").value = state.dom;
  $("extCount").value = state.exts.length;
  $("topology").value = state.topology;
  $("voronoi").checked = state.voronoi;
  $("recipe").value = state.recipe;
  $("hue").value = roundHalfAway(state.hue);
  $("eyes").value = state.eyes;
  $("mouth").value = state.mouth;
  for (const id of ["radScale","tenScale","extLen","extWid","weld"]) $(id).value = 1;
  $("extCurl").value = 1;
  render();
}
// spoke-count knob: re-slice or extend the decoded set deterministically
$("spokes").addEventListener("input", () => {
  const want = +$("spokes").value;
  const b = bits(seedFromText($("seed").value) * 7n + 13n);
  while (state.spokes.length < want) {
    const base = (state.spokes.length / want) * Math.PI * 2;
    state.spokes.push({ theta: base + b.lin(-0.3, 0.3), r: b.lin(0.12, 1.35), tension: b.lin(0.4, 2.6) });
  }
  state.spokes.length = want;
  render();
});
$("rerollBody").addEventListener("click", () => {
  const b = bits(Date.now() % 100000);
  const n = +$("spokes").value;
  state.spokes = Array.from({length: n}, (_, i) => ({
    theta: (i/n)*Math.PI*2 + b.lin(-0.45,0.45)*Math.PI*2/n,
    r: b.lin(0.12, 1.35),
    tension: b.lin(0.4, 2.6),
  }));
  render();
});
$("rerollExt").addEventListener("click", () => {
  const b = bits(Date.now() % 100000 + 7);
  state.exts = Array.from({length: 3}, () => ({
    theta: b.lin(Math.PI*0.95, Math.PI*2*1.02), len: b.lin(0.35,1.15),
    width: b.lin(0.10,0.30), curl: b.lin(-1.3,1.3), taper: b.lin(0.15,0.85),
  }));
  state.extFills = state.exts.map(() => b.byte() % 3);
  render();
});
$("rerollSites").addEventListener("click", () => {
  const b = bits(Date.now() % 100000 + 31);
  const pairs = 8 + (b.byte() % 6);
  state.sites = [];
  for (let i = 0; i < pairs; i++) {
    const x = b.lin(0.04,1.05), y = b.lin(-1.05,1.05);
    const s3 = b.byte() % 4, shade = s3 === 0 ? 0 : s3 === 1 ? 1 : 2;
    state.sites.push({x,y,shade},{x:-x,y,shade});
  }
  render();
});
$("decodeBtn").addEventListener("click", loadSeed);
$("gachaBtn").addEventListener("click", () => { $("seed").value = Math.floor(Math.random()*99999); loadSeed(); });
$("seed").addEventListener("keydown", e => { if (e.key === "Enter") loadSeed(); });
for (const id of knobIds()) $(id).addEventListener("input", render);
for (const id of ["topology","voronoi","recipe","eyes","mouth"]) $(id).addEventListener("change", render);

const moodsDiv = $("moods");
for (const m of MOODS) {
  const btn = document.createElement("button");
  btn.textContent = m;
  if (m === mood) btn.classList.add("active");
  btn.addEventListener("click", () => {
    mood = m;
    for (const x of moodsDiv.children) x.classList.toggle("active", x.textContent === m);
    render();
  });
  moodsDiv.appendChild(btn);
}
$("pinBtn").addEventListener("click", () => {
  const k = currentParams();
  const snapshot = JSON.parse(JSON.stringify(k));
  const div = document.createElement("div");
  div.className = "pin";
  const inner = document.createElement("div");
  inner.innerHTML = creatureSVG(k, mood, 84);
  div.appendChild(inner);
  const label = document.createElement("span");
  label.textContent = `pin ${pins.length + 1}`;
  div.appendChild(label);
  div.addEventListener("click", () => {
    state = snapshot;
    for (const id of ["dom","radScale","tenScale","extCount","extLen","extWid","extCurl","weld","hue"]) $(id).value = snapshot[id === "dom" ? "dom" : id] ?? $(id).value;
    $("topology").value = snapshot.topology; $("voronoi").checked = snapshot.voronoi;
    $("recipe").value = snapshot.recipe; $("eyes").value = snapshot.eyes; $("mouth").value = snapshot.mouth;
    render();
  });
  pins.push(snapshot);
  $("pins").appendChild(div);
});
$("clearPins").addEventListener("click", () => { pins.length = 0; $("pins").innerHTML = ""; });
$("sweep50").addEventListener("click", () => stressSweep(50));
$("sweep300").addEventListener("click", () => stressSweep(300));

const params = new URLSearchParams(location.search);
if (params.has("seed")) $("seed").value = params.get("seed");
if (params.has("mood") && MOODS.includes(params.get("mood"))) mood = params.get("mood");
// ?stress=N runs the sweep on load — a shareable "prove it" link, and the
// path headless screenshots exercise.
// ?probe=SEED emits the same canonical geometry line the Rust --probe
// prints, so scripts/drift-check.sh can diff the two renderers instead of
// assuming they agree. Written into the DOM for --dump-dom to read.
if (params.has("probe")) {
  const seed = seedFromText(params.get("probe"));
  // Render at the canonical 240-unit cell so the numbers are comparable
  // with Rust --probe, which works in that cell.
  creatureSVG(paramsFromSeed(seed), "neutral", 240);
  const m = lastMetrics;
  const f1 = v => v.toFixed(1);
  let line;
  if (!m || !m.placed) {
    line = `seed=${seed} NO-PLACEMENT`;
  } else {
    const q = m.probe;
    line = `seed=${seed} spokes=${q.spokes} exts=${q.exts} topo=${q.topo}`
      + ` vor=${q.vor} pts=${q.pts}`
      + ` bbox=${q.bbox.map(f1).join(",")}`
      + ` face=${f1(q.fx)},${f1(q.eyeY)},${f1(q.ipd)},${f1(q.r)},${q.mouthFits}`
      + ` mouthy=${f1(q.mouthY)}`
      + ` belly=${q.belly}`;
  }
  document.body.innerHTML = `<pre id="probe">${line}</pre>`;
  throw new Error("probe-done"); // stop the normal render path
}
if (params.has("stress")) {
  const n = Math.max(1, Math.min(2000, parseInt(params.get("stress"), 10) || 50));
  setTimeout(() => stressSweep(n), 0);
}
loadSeed();
</script>
</body>
</html>
