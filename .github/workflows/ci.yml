name: CI

on:
  push:
    # train/** is the CI-gated landing path: a train branch is pushed
    # first, CI here is the gate, and main is fast-forwarded only on a
    # green run. Without this trigger a train push gets no check at all,
    # and required status checks would make main unpushable.
    branches: [master, 'train/**']
  pull_request:
  # Daily, because this repo CAN go red with no commit of mine and I said
  # in the fleet channel that it could not. Every cargo dependency is a
  # pinned crates.io version with no git or path edges, which is what I
  # was thinking of — but the TOOLCHAIN floats: `dtolnay/rust-toolchain@stable`
  # installs whatever stable is that morning, and this repo already ran red
  # for seven consecutive commits when stable gained clippy's chunks_exact
  # lint. A push gate asks "is this change good"; this asks "is what already
  # landed still good against a toolchain that moved overnight".
  #
  # 11:00Z deliberately: the fleet's crons bunch in the early morning and
  # land four to five hours late on a shared queue.
  schedule:
    - cron: '0 11 * * *'
  # Reusable so a future release workflow gates on the exact same matrix.
  workflow_call:

concurrency:
  # Rapid pushes to the same ref cancel earlier runs; only the tip is
  # verified. Per-commit evidence (bisects, release tags) must not rely on
  # this workflow's run history.
  #
  # EVENT NAME IS IN THE GROUP because a scheduled run and a push to the
  # same ref otherwise share it, and the push cancels the cron. Measured
  # here: 6 of the last 20 scheduled runs were cancelled that way, and the
  # last one that actually completed was eight days before I looked. A
  # cancelled run is not a failure — it is A SAMPLE NEVER TAKEN — and it
  # is invisible, because nothing is red and the schedule looks alive.
  # The daily run exists precisely to measure an unchanged sha against a
  # moving world, so letting a push cancel it destroys the one measurement
  # no push can make.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux only for now: this repo is pure computation (no I/O, no platform
  # paths, no networking), and its whole design goal is that outputs are
  # byte-identical across platforms — a property enforced by pinned integer
  # math and golden vectors rather than by a CI matrix. macOS is the
  # continuously-exercised development platform. A Windows leg becomes
  # worthwhile the moment any consumer builds this crate on Windows;
  # revisit then.
  #
  # Runner is Blacksmith, not GitHub-hosted: free-plan org, private repo —
  # GitHub bills private-repo Actions minutes and blocks jobs at the zero
  # spending limit. Blacksmith runners do not consume GitHub minutes.
  # Revert to ubuntu-latest if the repo becomes public.
  test:
    name: Test (ubuntu)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Paired with the post-build check at the end of this job: the property
      # tested is "the build rewrote a tracked file", not "the tree is clean".
      - name: Snapshot tree state
        run: git status --porcelain | sort > "$RUNNER_TEMP/tree-before.txt"
        shell: bash

      # First, because a broken precondition invalidates everything after
      # it: a narrowed trigger means this run does not gate a train at all.
      # Seconds, so it fails fast rather than after the suite.
      - name: Train preconditions
        run: ./scripts/check-train-preconditions.sh

      - name: Format check
        run: cargo fmt --all -- --check

      # Later checks run even when an earlier check failed: a lint failure
      # must not suppress the test signal (a red job meaning "lint failed,
      # tests unknown" is indistinguishable from "lint failed, tests passed").
      # The format check itself stays unguarded: everything before it is
      # setup, so its failure means the toolchain is absent, not a policy skip.
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # --all-targets lints the dev profile only; lint release too so
      # release-only dead code and cfg(not(debug_assertions)) warnings surface.
      - name: Clippy (release profile)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --release --locked -- -D warnings

      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-targets --locked

      # --all-targets does not include doctests (it expands to
      # --lib --bins --tests --benches --examples), so doc examples need
      # their own leg or they arrive unchecked.
      - name: Doc tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc --locked

      # Regenerate all pinned spec tables and require byte-identical output.
      # This is this repo's load-bearing determinism gate: a hand-edited
      # generated file, or a minting script whose output drifted from the
      # committed bytes, fails here and nowhere else.
      - name: Minted tables are reproducible
        if: ${{ !cancelled() }}
        run: |
          cargo run --locked -p avatar-tables --bin mint
          git diff --exit-code

      # The workspace test leg already covers this, but the corpus deserves its
      # own named gate so byte drift is legible at a glance in the CI run list.
      - name: Golden corpus is current
        if: ${{ !cancelled() }}
        run: cargo test --locked -p avatar-vectors

      # Byte-equality only proves what the corpus contains. This asks the
      # other half: does the corpus still contain what real genomes reach?
      # The hand-picked vectors once missed nine decode selectors live agents
      # hit, including a mouth dispatch arm no port had been compared on.
      # Uniform draws match the distribution of blake3-derived fleet genomes,
      # so this needs no registry data to re-ask the question.
      - name: Corpus covers the reachable genome space
        if: ${{ !cancelled() }}
        run: cargo run --locked -q -p avatar-genome --example fleet_coverage -- --population 1000

      # The playground is a separate workspace, so every gate above misses
      # it. That was fine while it was a sketch and is not now: it is the
      # source the second creature type will be ported from.
      - name: Playground lints
        if: ${{ !cancelled() }}
        working-directory: playground
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings

      # Eyes inside the body, eyes clear of each other, mouth inside the
      # body, SDF-verified across 300 genomes. These were proved by hand
      # until now, and a proof nobody runs is a proof nobody has.
      - name: Wild placement invariants
        if: ${{ !cancelled() }}
        working-directory: playground
        run: |
          cargo test --locked
          cargo run --locked -q --bin grid -- --check 300

      # The renderers' tuning constants, compared as sets. This is the half
      # of the drift check that needs no browser, and it was reachable only
      # through the half that does — so the gate that catches a constant
      # edited in one renderer and not the other ran on one machine and
      # never on the runner. drift-check.sh itself stays local because it
      # drives a headless browser; this does not, and had no reason to
      # inherit that dependency.
      - name: Renderer constants agree
        if: ${{ !cancelled() }}
        run: python3 scripts/const-drift.py

      # A generated file edited by hand is invisible to every test above.
      # Compares against the snapshot rather than requiring an empty tree,
      # so the delta is attributable to the build.
      - name: Build did not modify tracked files
        if: ${{ !cancelled() }}
        run: |
          git status --porcelain | sort > "$RUNNER_TEMP/tree-after.txt"
          if ! diff -q "$RUNNER_TEMP/tree-before.txt" "$RUNNER_TEMP/tree-after.txt" >/dev/null; then
            echo "the build rewrote tracked files:" >&2
            diff "$RUNNER_TEMP/tree-before.txt" "$RUNNER_TEMP/tree-after.txt" >&2 || true
            git diff >&2
            exit 1
          fi

  # Keep port conformance separate from the canonical Rust gate so a byte drift
  # identifies the affected implementation directly in the CI job list.
  ts-port:
    name: TypeScript port (ubuntu)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - name: Install TypeScript port dependencies
        working-directory: ports/ts
        run: bun install --frozen-lockfile

      # bun test executes TypeScript without typechecking, so tsc is its own
      # gate — without it, type errors accumulate silently while tests pass.
      - name: Typecheck
        working-directory: ports/ts
        run: bunx tsc --noEmit

      - name: Test TypeScript port conformance
        if: ${{ !cancelled() }}
        working-directory: ports/ts
        run: bun test

  # Swift port conformance. One Linux leg is sufficient even though this
  # package's consumers are Apple platforms: AvatarKit is pure computation
  # with no platform APIs, and its BLAKE3 dependency is the portable-only C
  # reference build (no SIMD), so every byte it produces is identical by
  # construction on any host. The golden corpus IS the cross-platform
  # assertion — this leg exercises the same committed vectors the Rust and
  # TypeScript legs use. If the container route ever hits a runner
  # limitation, fall back to installing Swift in the job via swiftly or a
  # toolchain tarball instead.
  #
  # `swift test` runs from the repository root: the manifest lives there (not
  # under ports/swift/) so the package is consumable by git URL.
  swift-port:
    name: Swift port (ubuntu)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5

      - name: Test Swift port conformance
        run: swift test
