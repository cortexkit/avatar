[package]
name = "avatar-vectors"
version = "0.1.0"
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true

[dev-dependencies]
avatar = { path = "../avatar", package = "cortexkit-avatar" }
avatar-genome = { path = "../avatar-genome", package = "cortexkit-avatar-genome" }
avatar-phenotype = { path = "../avatar-phenotype", package = "cortexkit-avatar-phenotype" }
avatar-raster = { path = "../avatar-raster", package = "cortexkit-avatar-raster" }
avatar-svg = { path = "../avatar-svg", package = "cortexkit-avatar-svg" }
blake3 = "1.5"
# Reads and writes the golden images in vectors/image. The pixels go in and
# come out verbatim, so premultiplied images stay premultiplied.
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
