[package]
name = "cortexkit-avatar-tables"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Committed lookup tables and integer helpers that keep avatar generation identical on every platform."

# Published as cortexkit-avatar-tables. The library keeps its short Rust
# name, so code imports it as `avatar_tables` under either package name.
[lib]
name = "avatar_tables"

[dependencies]
blake3 = "1.5"
