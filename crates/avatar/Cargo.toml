[package]
name = "cortexkit-avatar"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Render a stored avatar: routes its type and generation version to the generator that draws it, and returns the render tree or a finished RGBA image."

# Published as cortexkit-avatar. The library keeps its short Rust name, so
# code imports it as `avatar` under either package name. A Rust host depends
# on this crate alone.
[lib]
name = "avatar"

[dependencies]
avatar-drawn-heads = { version = "0.1.0", path = "../avatar-drawn-heads", package = "cortexkit-avatar-drawn-heads" }
avatar-genome = { version = "0.1.0", path = "../avatar-genome", package = "cortexkit-avatar-genome" }
avatar-knitted-toys = { version = "0.1.0", path = "../avatar-knitted-toys", package = "cortexkit-avatar-knitted-toys" }
avatar-phenotype = { version = "0.1.0", path = "../avatar-phenotype", package = "cortexkit-avatar-phenotype" }
avatar-pixel-critters = { version = "0.1.0", path = "../avatar-pixel-critters", package = "cortexkit-avatar-pixel-critters" }
avatar-raster = { version = "0.1.0", path = "../avatar-raster", package = "cortexkit-avatar-raster" }
avatar-small-robots = { version = "0.1.0", path = "../avatar-small-robots", package = "cortexkit-avatar-small-robots" }
avatar-sprouts = { version = "0.1.0", path = "../avatar-sprouts", package = "cortexkit-avatar-sprouts" }
avatar-svg = { version = "0.1.0", path = "../avatar-svg", package = "cortexkit-avatar-svg" }
avatar-wild-plus = { version = "0.1.0", path = "../avatar-wild-plus", package = "cortexkit-avatar-wild-plus" }
