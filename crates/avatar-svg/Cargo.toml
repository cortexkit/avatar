[package]
name = "cortexkit-avatar-svg"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic avatar creature generators, the render tree they produce, and its JSON and SVG serializers."

# Published as cortexkit-avatar-svg. The library keeps its short Rust
# name, so code imports it as `avatar_svg` under either package name.
[lib]
name = "avatar_svg"

[dependencies]
avatar-genome = { version = "0.1.0", path = "../avatar-genome", package = "cortexkit-avatar-genome" }
avatar-phenotype = { version = "0.1.0", path = "../avatar-phenotype", package = "cortexkit-avatar-phenotype" }
avatar-tables = { version = "0.1.0", path = "../avatar-tables", package = "cortexkit-avatar-tables" }

[dev-dependencies]
blake3 = "1.5"
serde_json = "1"
