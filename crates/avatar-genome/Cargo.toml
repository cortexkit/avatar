[package]
name = "avatar-genome"
version = "0.1.0"
edition.workspace = true

[dependencies]
avatar-phenotype = { path = "../avatar-phenotype" }
avatar-tables = { path = "../avatar-tables" }
blake3 = "1.5"

[dev-dependencies]
# Dev-only: lets the sample-render example exercise the full DNA -> SVG
# pipeline. The library dependency direction stays genome-free in avatar-svg.
avatar-svg = { path = "../avatar-svg" }
# Dev-only: the fleet_coverage example reads deposit manifests. The library
# itself stays serde-free — genomes are bytes, not documents.
serde_json = "1"
