[package]
name = "avatar-export"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true
repository.workspace = true
description = "Export stored avatar genomes to PNG, SVG, or render-tree JSON."

[dependencies]
avatar = { path = "../avatar", package = "cortexkit-avatar" }
avatar-genome = { path = "../avatar-genome", package = "cortexkit-avatar-genome" }
avatar-svg = { path = "../avatar-svg", package = "cortexkit-avatar-svg" }
resvg = "0.44"
serde_json = "1"

[[bin]]
name = "avatar-export"
path = "src/main.rs"
