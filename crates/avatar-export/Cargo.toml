[package]
name = "avatar-export"
version = "0.1.0"
edition = "2021"
publish = false
description = "PNG export surface for fleet consumers (GitHub App avatars): stableId in, deterministic 400x400 PNG out."

[dependencies]
avatar-genome = { path = "../avatar-genome" }
avatar-svg = { path = "../avatar-svg" }
resvg = "0.44"

[[bin]]
name = "avatar-export"
path = "src/main.rs"
